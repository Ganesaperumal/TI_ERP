<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#cloudGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Cloud Outline Shape -->
  <path d="M 180 280 L 155 280 A 55 55 0 0 1 155 170 A 90 90 0 0 1 325 155 A 70 70 0 0 1 370 280 L 180 280 Z" 
        fill="none" 
        stroke="url(#cloudGrad)" 
        stroke-width="18" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- Central Headquarters / Store Pillar -->
  <rect x="216" y="220" width="80" height="150" rx="8" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="8" />
  <!-- Window Grid -->
  <rect x="232" y="240" width="16" height="16" rx="2" fill="#38bdf8" />
  <rect x="264" y="240" width="16" height="16" rx="2" fill="#38bdf8" />
  <rect x="232" y="270" width="16" height="16" rx="2" fill="#38bdf8" />
  <rect x="264" y="270" width="16" height="16" rx="2" fill="#38bdf8" />
  <rect x="232" y="300" width="16" height="16" rx="2" fill="#38bdf8" />
  <rect x="264" y="300" width="16" height="16" rx="2" fill="#38bdf8" />

  <!-- Left & Right Store Nodes -->
  <rect x="130" y="275" width="55" height="95" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="6" />
  <rect x="327" y="275" width="55" height="95" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="6" />

  <!-- Network Connecting Lines -->
  <line x1="185" y1="320" x2="216" y2="320" stroke="#818cf8" stroke-width="6" stroke-dasharray="4 4" />
  <line x1="296" y1="320" x2="327" y2="320" stroke="#818cf8" stroke-width="6" stroke-dasharray="4 4" />

  <!-- Crown / Owner Star Emblem on Top -->
  <polygon points="256,90 268,118 298,118 274,136 283,164 256,146 229,164 238,136 214,118 244,118" 
           fill="url(#goldGrad)" 
           filter="url(#glow)" />

  <!-- Bottom Label Badge -->
  <rect x="120" y="425" width="272" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="256" y="453" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#a5b4fc" text-anchor="middle" letter-spacing="3">TI CLOUD HO</text>
</svg>
