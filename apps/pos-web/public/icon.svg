<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Inner Soft Ambient Glow -->
  <circle cx="256" cy="230" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <!-- Supermarket Cart Base & Handle -->
  <path d="M 120 150 L 160 150 L 205 320 L 375 320 L 410 190 L 195 190" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Cart Basket Grid Lines -->
  <line x1="225" y1="235" x2="390" y2="235" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="245" y1="280" x2="370" y2="280" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="270" y1="195" x2="255" y2="315" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="330" y1="195" x2="320" y2="315" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- Cart Wheels -->
  <circle cx="225" cy="380" r="24" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="225" cy="380" r="10" fill="#0f172a" />
  <circle cx="355" cy="380" r="24" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="355" cy="380" r="10" fill="#0f172a" />

  <!-- Lightning Bolt (Sub-second POS speed) -->
  <polygon points="315,95 245,210 295,210 265,305 365,175 315,175" 
           fill="url(#boltGrad)" 
           filter="url(#glow)" />

  <!-- TI Monogram Text Tag -->
  <rect x="140" y="425" width="232" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="256" y="453" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#38bdf8" text-anchor="middle" letter-spacing="3">TI-ERP POS</text>
</svg>
